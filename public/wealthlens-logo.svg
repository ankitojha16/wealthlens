<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WealthLens emblem">
  <defs>
    <radialGradient id="navy" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#143b65"/>
      <stop offset="45%" stop-color="#0b2542"/>
      <stop offset="100%" stop-color="#03101f"/>
    </radialGradient>

    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c5700"/>
      <stop offset="16%" stop-color="#ffd968"/>
      <stop offset="35%" stop-color="#fff0a0"/>
      <stop offset="52%" stop-color="#d99a19"/>
      <stop offset="68%" stop-color="#ffcf4b"/>
