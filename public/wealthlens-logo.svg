  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#goldBright)" stroke-width="10" opacity="0.95"/>
  <circle cx="256" cy="256" r="119" fill="none" stroke="#d89a19" stroke-width="2" opacity="0.9"/>

